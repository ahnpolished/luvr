# Configuration file for prek — a fast Git hook framework written in Rust.
# https://prek.j178.dev
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer", exclude = ".wrangler/" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
]

# ruff — fast Python linter + formatter
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.18"
hooks = [
    { id = "ruff", args = ["--fix"] },
    { id = "ruff-format" },
]

# ty — extremely fast Python type checker (replaces mypy)
[[repos]]
repo = "local"
hooks = [
    {
        id = "ty-check",
        name = "ty",
        language = "system",
        entry = "uv",
        args = ["run", "ty", "check", "src/"],
        pass_filenames = false,
    },
]

# terraform — fmt (local, uses system terraform)
[[repos]]
repo = "local"
hooks = [
    {
        id = "terraform-fmt",
        name = "terraform fmt",
        language = "system",
        entry = "terraform",
        args = ["fmt", "-check", "-diff", "-recursive"],
        files = "\\.tf$",
        pass_filenames = false,
    },
    {
        id = "terraform-validate",
        name = "terraform validate (envs)",
        language = "system",
        entry = "bash",
        args = [
            "-c",
            "for dir in infra/envs/*/; do echo \"  validating $dir\"; terraform -chdir=\"$dir\" init -backend=false > /dev/null 2>&1 && terraform -chdir=\"$dir\" validate || exit 1; done",
        ],
        files = "^infra/",
        pass_filenames = false,
    },
]

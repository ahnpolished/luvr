[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luvr"
version = "0.1.0"
description = "💝 iMessage-based dating advice chatbot — supports text, photo & voice memo messages"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Humphrey Ahn", email = "stahn1995@gmail.com"}
]
keywords = ["imessage", "chatbot", "dating-advice", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "anthropic>=0.42.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "structlog>=24.4.0",
    "python-telegram-bot[job-queue]>=21.0",
    "opencode-ai>=0.1.0a1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.8.0",
    "ty>=0.0.51",
    "deepeval>=4.0.0",
    "Pillow>=10.0.0",
]
opencode = ["opencode-ai>=0.1.0a1"]

[project.scripts]
luvr-telegram = "src.telegram_server:main"
luvr-server = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "examples*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --ignore=tests/eval"
markers = [
    "eval: AI evaluation case (DeepEval)",
    "slow: slow-running test (full eval suite)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N806"]
"scripts/**/*.py" = ["N806"]
"src/llm/prompts.py" = ["E501"]
"tests/eval/test_persona_*.py" = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Skip optional dependency with no stubs
unresolved-import = "ignore"

name: Railway Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy Railway (Staging)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API server (Staging)
        run: railway up --service luvr --environment staging -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Telegram worker (Staging)
        run: railway up --service telegram-worker-staging --environment staging -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-production:
    name: Deploy Railway (Production)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API server (Production)
        run: railway up --service luvr --environment production -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Telegram worker (Production)
        run: railway up --service telegram-worker --environment production -y
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

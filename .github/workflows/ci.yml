name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with ty
        run: ty check src/

      - name: Test with coverage
        run: |
          pytest tests/ --ignore=tests/eval --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=55

      - name: Upload coverage to Codecov (optional)
        if: success() || failure()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  eval:
    name: Eval ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run eval suite (deterministic metrics — no API keys needed)
        run: |
          pytest tests/eval/ -v -o "addopts=-v --tb=short" -m "eval and not slow"

      - name: Full eval suite (slow)
        if: success() || failure()
        run: |
          pytest tests/eval/ -v -o "addopts=-v --tb=short" -m "slow"
        continue-on-error: true
